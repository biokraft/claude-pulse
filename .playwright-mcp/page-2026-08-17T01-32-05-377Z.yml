            - time [ref=f5e121]: 2 months ago
        - generic [ref=f5e122]:
          - paragraph [ref=f5e123]: I published a new Connect IQ application on June 1, 2026. The application was previously distributed through the Beta channel and uploaded successfully using the same project and the same signing key.
          - paragraph [ref=f5e124]:
            - text: "The Store URL is:"
            - link "apps.garmin.com/.../1679c143-4f3d-44cb-b933-bb8f38636025" [ref=f5e125] [cursor=pointer]:
              - /url: https://apps.garmin.com/sk-SK/apps/1679c143-4f3d-44cb-b933-bb8f38636025
            - text: "The application manifest contains: 1679c143-4f3d-44cb-b933-bb8f38636025"
          - paragraph [ref=f5e126]: "When uploading an update (both as the public and as beta version) , Connect IQ Store reports: \"The app ID contained in the manifest file differs from the ID originally registered for this application.\""
          - paragraph [ref=f5e127]: The UUID in the manifest matches the UUID in the Store URL.
          - paragraph [ref=f5e128]: No changes were made to the signing key or application ID.
          - paragraph [ref=f5e129]: This started immediately after the publication process, during the period when Connect IQ upload services were experiencing communication/server issues.
          - paragraph [ref=f5e130]: Could someone please verify whether the application record in the Store is correctly associated with the manifest UUID? Or what else shall I do to actualize the application?
        - list [ref=f5e134]:
