name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste your relay token or tunnel URL —
        together they grant read access to your usage snapshot.

  - type: dropdown
    id: component
    attributes:
      label: Where is the problem?
      options:
        - Watch app
        - Relay
        - Not sure
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Garmin device (or simulator target)
      placeholder: Forerunner 570 47mm
    validations:
      required: false

  - type: input
    id: platform
    attributes:
      label: Relay host OS and Go version
      placeholder: macOS 15.6, go1.25.0
    validations:
      required: false

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: "`claude-pulse-relay status` output"
      description: >
        Run it and paste the whole report. It never prints your token, and it
        answers most of what we would otherwise have to ask you.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: From `~/.claude-pulse/relay.log` or `journalctl --user -u claude-pulse-relay`. Redact the token.
      render: shell
