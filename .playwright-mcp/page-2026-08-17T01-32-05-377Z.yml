                  - time [ref=f5e153]: 2 months ago
            - paragraph [ref=f5e156]: The Store UUID is distinct from the App UUID. You, the developer generate the App UUID and Garmin issues one for the Store URL.If you haven't published publicly before - just create a new app UUID and upload (it has to be unique and different from your beta app).
