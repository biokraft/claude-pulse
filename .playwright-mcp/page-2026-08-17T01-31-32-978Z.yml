            - list [ref=f2e224]:
              - listitem [ref=f2e225]: Creating an account pretending to be someone else
              - listitem [ref=f2e226]: Forging headers or otherwise manipulating identifiers to disguise the origin of any message you send to Garmin on or through the Site
