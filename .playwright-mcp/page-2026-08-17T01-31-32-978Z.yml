    - generic [ref=f2e139]:
      - separator [ref=f2e141]
      - heading [level=3] [ref=f2e143]:
        - paragraph [ref=f2e144]: RULES OF CONDUCT
      - generic [ref=f2e146]:
        - paragraph [ref=f2e147]: You are responsible for your conduct on the Site. By using the Site, you agree to abide by our Rules of Conduct.
        - list [ref=f2e148]:
          - listitem [ref=f2e149]:
            - paragraph [ref=f2e150]:
              - strong [ref=f2e151]: No Harm or Abuse of Others.
              - text: You must not abuse, harass, or threaten anyone on the Site. You must not promote violence, terrorism, sexual assault, etc.
            - paragraph [ref=f2e152]:
              - strong [ref=f2e153]: "Examples of Violations:"
            - list [ref=f2e154]:
              - listitem [ref=f2e155]: Engaging in bullying, stalking, or sexual harassment
              - listitem [ref=f2e156]: Posting a threatening message, whether the threatened harm is physical, financial, or otherwise
              - listitem [ref=f2e157]: Posting photos that depict animal torture
          - listitem [ref=f2e158]:
            - paragraph [ref=f2e159]:
              - strong [ref=f2e160]: No Violation of Laws or Rights.
              - text: You must abide by the law in your use of the Site. You must not defame another person, infringe their intellectual property rights, or violate their right to privacy.
            - paragraph [ref=f2e161]:
              - strong [ref=f2e162]: "Examples of Violations:"
            - list [ref=f2e163]:
              - listitem [ref=f2e164]: Posting copyrighted content without permission of the copyright holder
              - listitem [ref=f2e165]: Using the Site to collect personal information to sell or otherwise exploit for commercial purposes
              - listitem [ref=f2e166]: Sharing another person’s personal information (such as their location or contact information) without their consent or for the purpose of harassment (i.e., “doxxing”)
              - listitem [ref=f2e167]: Engaging in human trafficking, terrorism, disseminating child sexual abuse materials, trafficking in obscene or stolen material, drug dealing or drug abuse, harassment, theft, or conspiracy to commit any criminal activity
          - listitem [ref=f2e168]:
            - paragraph [ref=f2e169]:
              - strong [ref=f2e170]: No Obscene, Profane, or Inappropriate Content.
              - text: You must not post pornography, obscenity, profanity, or explicit descriptions or displays of nudity or activities.
            - paragraph [ref=f2e171]:
              - strong [ref=f2e172]: "Examples of Violations:"
            - list [ref=f2e173]:
              - listitem [ref=f2e174]: Photos that depict genitalia
              - listitem [ref=f2e175]: Photos that are intended to be sexually gratifying, even if containing no nudity
              - listitem [ref=f2e176]: Content relating to bestiality
          - listitem [ref=f2e177]:
            - paragraph [ref=f2e178]:
              - strong [ref=f2e179]: No Hate Speech.
              - text: You must not post hate speech. “Hate speech” is content that attacks another person based on race, ethnicity, national origin, immigration status, caste, sexual orientation, sex, gender identity and expression, religion or faith, age, disability, serious disease, weight or size, pregnancy, or veteran status.
            - paragraph [ref=f2e180]:
              - strong [ref=f2e181]: "Examples of Violations:"
            - list [ref=f2e182]:
              - listitem [ref=f2e183]: Using slurs, negative stereotypes, caricatures, or generalizations
              - listitem [ref=f2e184]: Attacking another user based on their citizenship or country of origin
              - listitem [ref=f2e185]: Calling for, or celebrating, violence against an ethnic group
              - listitem [ref=f2e186]: Posting images or symbols associated with hate groups, such as swastikas
          - listitem [ref=f2e187]:
            - paragraph [ref=f2e188]:
              - strong [ref=f2e189]: No Advertising.
              - text: Except with Garmin’s prior written authorization, you must not use the Site for commercial activities or advertising, whether or not for a profit.
            - paragraph [ref=f2e190]:
              - strong [ref=f2e191]: "Examples of Violations:"
            - list [ref=f2e192]:
              - listitem [ref=f2e193]: Sending or posting any advertising or promotional material, including any "junk mail," "chain letter," "spam," or any other similar solicitation, regardless of whether or not the recipient has consented to receive such messages
              - listitem [ref=f2e194]: Running a giveaway or contest, without Garmin’s prior written authorization, for a prize with monetary value
              - listitem [ref=f2e195]: Creating a profile on the Site that promotes a business
          - listitem [ref=f2e196]:
            - paragraph [ref=f2e197]:
              - strong [ref=f2e198]: No Fraudulent or Deceptive Activity.
              - text: You may not use the Site in a manner that constitutes fraudulent or deceptive activity.
            - paragraph [ref=f2e199]:
              - strong [ref=f2e200]: "Examples of Violations:"
            - list [ref=f2e201]:
              - listitem [ref=f2e202]: Using multiple accounts to boost a rating of content on the Site
              - listitem [ref=f2e203]: Participating in or organizing “review bombs” on the Site
              - listitem [ref=f2e204]: Engaging in schemes to pay people to follow you or to post positive reviews
              - listitem [ref=f2e205]: Faking activity results to win a reward or prize in a promotional contest
          - listitem [ref=f2e206]:
            - paragraph [ref=f2e207]:
              - strong [ref=f2e208]: No Spam, Malicious Software, or Other Damaging or Disruptive Activity.
              - text: You may not use the Site in any manner that could overburden, damage, impair, disable, or breach the security of any Garmin server or network, or interfere with anyone else’s use and enjoyment of the Site.
            - paragraph [ref=f2e209]:
              - strong [ref=f2e210]: "Examples of Violations:"
            - list [ref=f2e211]:
              - listitem [ref=f2e212]: Uploading content that contains a virus or other harmful component
              - listitem [ref=f2e213]: Attempting to gain unauthorized access to the Site, other accounts, or any systems or networks connected to the Site, whether through hacking or any other means
              - listitem [ref=f2e214]: Using any process, whether automated or manual, that accesses, copies, or scrapes content from the Site through any means not purposely made available through the Site
              - listitem [ref=f2e215]: Probing, scanning, or testing the vulnerability of the Site or any related system or network
              - listitem [ref=f2e216]: Taking any action that imposes an unreasonable or disproportionately large load on the infrastructure of the Site, related systems or networks, or Garmin personnel
              - listitem [ref=f2e217]: Making repetitive posts or posting off-topic content on a portion of the Site with a designated topic or theme
              - listitem [ref=f2e218]: Creating, then deleting, then re-creating an account an excessive number of times
          - listitem [ref=f2e219]:
            - paragraph [ref=f2e220]:
              - strong [ref=f2e221]: Do Not Impersonate Others.
              - text: You must not impersonate anyone else on the Site or pretend to represent a person or organization that has not authorized you to act on their behalf.
            - paragraph [ref=f2e222]:
