name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: relay } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # The image's own entrypoint compiles, starts Xvfb and the simulator, runs
      # monkeydo and translates its output into an exit code — monkeydo always
      # exits 1, even when every test passes. Driving those steps by hand instead
      # just hangs, so mount watch/ as the app and let the entrypoint do its job.
      - name: Run unit tests
        run: |
          docker run --rm -v "$PWD/watch":/app -w /app \
            ghcr.io/matco/connectiq-tester@sha256:7a6f586cb0e0393ff288da09cf27b6dad40a0058a346c529b99fd0fc19858f0f \
            fr965
