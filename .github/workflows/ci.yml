name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: relay } }
    steps:
      - uses: actions/checkout@v4
      - name: Check for leaked personal data
        working-directory: .
        run: bash scripts/check-no-leaks.sh
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      # The installer is the documented entry point, so a break in it is a
      # break in the quickstart. Runs against this checkout, not a clone.
      # The service path needs a systemd user session, which a runner has no
      # way to provide, so it is verified by hand on macOS instead.
      - name: Check the installer
        working-directory: .
        env:
          PREFIX: ${{ runner.temp }}/bin
          CLAUDE_PULSE_HOME: ${{ runner.temp }}/pulse-home
        run: |
          set -euo pipefail
          bash -n install.sh

          echo "::group::fresh install"
          bash install.sh
          "$PREFIX/claude-pulse-relay" version
          "$PREFIX/claude-pulse-relay" help > /dev/null
          echo "::endgroup::"

          # Generate a config, so the upgrade has something it could destroy.
          "$PREFIX/claude-pulse-relay" --no-tunnel -listen 127.0.0.1:8797 &
          relay_pid=$!
          sleep 3
          kill "$relay_pid" || true
          token_before="$(jq -r .token "$CLAUDE_PULSE_HOME/config.json")"
          [ -n "$token_before" ] && [ "$token_before" != "null" ]

          echo "::group::upgrade (re-run)"
          out="$(bash install.sh 2>&1)"
          echo "$out"
          echo "::endgroup::"

          grep -q "Upgrading claude-pulse-relay" <<<"$out" \
            || { echo "second run did not detect the existing install"; exit 1; }
          "$PREFIX/claude-pulse-relay" version
          "$PREFIX/claude-pulse-relay" help > /dev/null

          token_after="$(jq -r .token "$CLAUDE_PULSE_HOME/config.json")"
          [ "$token_before" = "$token_after" ] \
            || { echo "upgrade changed the access token"; exit 1; }

          receipt="$(cat "$CLAUDE_PULSE_HOME/installed-version")"
          installed="$("$PREFIX/claude-pulse-relay" version | awk '{print $2}')"
          [ "$receipt" = "$installed" ] \
            || { echo "receipt $receipt != installed $installed"; exit 1; }

          # A rolled-back or half-finished upgrade leaves these behind.
          for stray in "$PREFIX/claude-pulse-relay.new" "$PREFIX/claude-pulse-relay.bak"; do
            [ ! -e "$stray" ] || { echo "left $stray behind"; exit 1; }
          done

  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Runs the same sequence as the image's tester.sh, with two deliberate
      # differences: type checking at level 2 rather than its hardcoded 3, and
      # `docker run` rather than a `container:` job — the latter overrides HOME,
      # and the simulator only finds its device bits under /root/.Garmin.
      # monkeydo exits 1 even when every test passes, so the verdict is read
      # from its output.
      - name: Run unit tests
        run: |
          docker run --rm -v "$PWD/watch":/app -w /app --entrypoint bash \
            ghcr.io/matco/connectiq-tester@sha256:7a6f586cb0e0393ff288da09cf27b6dad40a0058a346c529b99fd0fc19858f0f \
            -c '
              set -e
              openssl genrsa -out /tmp/key.pem 4096
              openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/key.pem -out /tmp/key.der -nocrypt
              monkeyc -f monkey.jungle -d fr965 -o /tmp/app.prg -y /tmp/key.der -t -l 2
              export DISPLAY=:1
              Xvfb "$DISPLAY" -screen 0 1280x1024x24 >/dev/null 2>&1 &
              simulator >/dev/null 2>&1 &
              sleep 15
              timeout 300 monkeydo /tmp/app.prg fr965 -t > /tmp/result.txt 2>&1 || true
              cat /tmp/result.txt
              tail -1 /tmp/result.txt | grep -q "^PASSED"
            '

  # Proves the release can actually be built before a tag exists. A broken
  # .goreleaser.yaml otherwise only surfaces after the tag is pushed, when the
  # release has already been created and the fix means cutting another version.
  release-dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          # Empty here on purpose: it exercises the path a fork takes, where
          # the cask is rendered but never pushed.
          TAP_TOKEN: ""
      - name: Check the archives contain a runnable binary
        run: |
          set -euo pipefail
          tar -xzf dist/claude-pulse-relay_*_linux_amd64.tar.gz -C /tmp
          /tmp/claude-pulse-relay version
