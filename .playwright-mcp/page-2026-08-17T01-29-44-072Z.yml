    - main [ref=f1e156]:
      - article [ref=f1e157]:
        - heading "Publishing to the Connect IQ Store" [level=1] [ref=f1e158]
        - generic [ref=f1e159]:
          - figure [ref=f1e160]
          - paragraph [ref=f1e162]:
            - text: We're glad you want to develop for Garmin devices, and we want you to be successful. Be sure to
            - link "review our guidelines" [ref=f1e163] [cursor=pointer]:
              - /url: http://developer.garmin.com/connect-iq/app-review-guidelines
            - text: and keep them in mind as you develop your apps.
          - paragraph [ref=f1e164]: Once your apps are fully tested and ready to go, you can publish and promote your apps to the Garmin Connect IQ App Store. Here's how to prepare your apps for submission.
          - list [ref=f1e165]:
            - listitem [ref=f1e166]:
              - paragraph [ref=f1e167]: Make sure the manifest file specifies all products supported by the app
            - listitem [ref=f1e168]:
              - paragraph [ref=f1e169]:
                - text: Use the
                - emphasis [ref=f1e170]: "Monkey C: Export Project"
                - text: command to generate an IQ file, which will contain binaries for each supported device
            - listitem [ref=f1e171]:
              - paragraph [ref=f1e172]: Upload the app to the App Store
        - article [ref=f1e173]:
          - heading "Check Supported Products" [level=2] [ref=f1e174]
          - generic [ref=f1e175]:
            - paragraph [ref=f1e176]: "It is easy to quickly check the products supported by an app by viewing the manifest XML file in the project root:"
            - code [ref=f1e178]: <iq:products> <iq:product id="fenix3"/> <iq:product id="vivoactive"/> <iq:product id="fr920xt"/> <iq:product id="epix"/> </iq:products>
        - article [ref=f1e179]:
          - heading "Exporting the App" [level=2] [ref=f1e180]
          - paragraph [ref=f1e182]:
            - text: Launch the Export Wizard with the
            - emphasis [ref=f1e183]: "Monkey C: Export Project"
            - text: command in the command palette. After setting the export destination folder the Monkey C extension will generate the
            - code [ref=f1e184]: .iq
            - text: file of your project.
        - article [ref=f1e185]:
          - heading "Publishing the First Version" [level=2] [ref=f1e186]
          - generic [ref=f1e187]:
            - paragraph [ref=f1e188]:
              - text: To upload the IQ file to your developer account, start by visiting the
              - link "Submit an App" [ref=f1e189] [cursor=pointer]:
                - /url: http://developer.garmin.com/connect-iq/submit-an-app/
              - text: page of the Garmin Developer site. Click on the
              - emphasis [ref=f1e190]: Submit an App
              - text: "button to fill out the form shown below:"
            - img "Uploading an app to the App Store" [ref=f1e191]
            - paragraph [ref=f1e192]: "Once the IQ file has been validated, add in a description, screen shots, and other details about your app:"
            - img "Adding a title and description" [ref=f1e193]
        - article [ref=f1e194]:
          - heading "GDPR" [level=2] [ref=f1e195]
          - generic [ref=f1e196]:
            - paragraph [ref=f1e197]:
              - text: In April of 2016, the EU Parliament passed the
              - link "General Data Protection Regulation" [ref=f1e198] [cursor=pointer]:
                - /url: https://publications.europa.eu/en/publication-detail/-/publication/3e485e15-11bd-11e6-ba9a-01aa75ed71a1/language-en
              - text: (GDPR), an act that was designed to harmonize data privacy laws across the European Union (EU). The GDPR provides requirements for the lawful processing of EU Personal Data, including requirements related to data privacy, consent, and digital services. GDPR generally applies to the processing of EU Personal Data, and it may apply to you or your company even if you are not in the EU. Data protection authorities may issue fines up to 4% of annual global turnover or €20 Million, whichever is greater, for non-compliance. . This isn't legal advice and we encourage you to consult with your legal counsel for guidance.
            - paragraph [ref=f1e199]:
              - text: Connect IQ is a global platform, and, as stated in the
              - link "Connect IQ license agreement" [ref=f1e200] [cursor=pointer]:
                - /url: https://developer.garmin.com/connect-iq/sdk
              - text: ", developers are responsible for their apps' compliance with all applicable laws, including those related to data protection and privacy. Specific responsibilities related to privacy can be found in Section 2 of the"
              - link "Connect IQ license agreement" [ref=f1e201] [cursor=pointer]:
                - /url: https://developer.garmin.com/connect-iq/sdk
              - text: ". Developers should review the GDPR to determine what obligations they may have under the GDPR. These obligations may include the following:"
            - list [ref=f1e202]:
              - listitem [ref=f1e203]:
                - paragraph [ref=f1e204]: Asking for consent for collection of personal data.
              - listitem [ref=f1e205]:
                - paragraph [ref=f1e206]: Providing access to information on what personal data concerning them is being processed, where and for what purpose.
              - listitem [ref=f1e207]:
                - paragraph [ref=f1e208]: Providing access to any personal data collected from them free of charge.
              - listitem [ref=f1e209]:
                - paragraph [ref=f1e210]: Ability for a user to erase their presence entirely within your product, including the ability to halt third party processing of personal data.
            - paragraph [ref=f1e211]:
              - text: If your solution collects personal data in any way, including using the
              - code [ref=f1e212]: Communications
              - text: permission to collect or retain personal data (potentially in conjunction with
              - code [ref=f1e213]: Sensor
              - text: ","
              - code [ref=f1e214]: Sensor History
              - text: ", or"
              - code [ref=f1e215]: Position
              - text: permissions) or using any other mechanism, you are responsible for ensuring that your solution is in compliance with GDPR.
        - article [ref=f1e216]:
          - heading "Approval Process" [level=2] [ref=f1e217]
          - generic [ref=f1e218]:
            - paragraph [ref=f1e219]: After your app is successfully uploaded to the app store, the Connect IQ team will review your submission. Aside from special circumstances, such as national holidays, reviews are completed within 72 hours.
            - paragraph [ref=f1e220]:
              - text: If you indicate your app uses one or more ANT+ profiles, an additional 48 hours is typically required to complete ANT+ certification. Once certification is complete, we'll provide ANT+ branding information and a link to the
              - link "ANT+ Directory" [ref=f1e221] [cursor=pointer]:
                - /url: https://www.thisisant.com/directory
              - text: to add to your app's description on the store.
            - paragraph [ref=f1e222]: While approval is pending, your app will not appear on the Garmin Connect App Store, but you will be able to preview your app and download it yourself for testing. Once it's approved, you will receive a notification and it will appear on the Connect IQ App Store for all users to download and load to their devices!
            - paragraph [ref=f1e223]: If for some reason your app is rejected, don't despair! The Connect IQ team will provide specific reasons for the rejection via email, and may work with you to resolve issues. The app will continue to be available for you to update as needed and re-submit for approval, but it will not be displayed on the Connect IQ App Store until approved.
