name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: relay } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  watch:
    runs-on: ubuntu-latest
    container: ghcr.io/matco/connectiq-tester@sha256:7a6f586cb0e0393ff288da09cf27b6dad40a0058a346c529b99fd0fc19858f0f
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway dev key
        run: |
          openssl genrsa -out /tmp/key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in /tmp/key.pem -out /tmp/key.der -nocrypt
      - name: Compile unit tests
        run: monkeyc -f watch/monkey.jungle -d fr965 -o /tmp/cp-test.prg -y /tmp/key.der --unit-test
      - name: Run unit tests
        run: |
          # monkeydo needs a running simulator on a display, and it exits 1 even
          # when every test passes — so the verdict comes from its output.
          export DISPLAY=:1
          Xvfb "$DISPLAY" -screen 0 1280x1024x24 &
          simulator > /dev/null 2>&1 &
          sleep 10
          monkeydo /tmp/cp-test.prg fr965 -t | tee /tmp/result.txt || true
          tail -1 /tmp/result.txt | grep -q '^PASSED'
